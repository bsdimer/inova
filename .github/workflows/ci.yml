name: CI

# GitFlow: develop is the integration branch (deploys to test), main holds
# releases. Pushes to either run every gate; only develop deploys for now —
# there is no production environment yet. Pull requests only run the gates.
on:
  push:
    branches: [main, develop]
  pull_request:

# Superseded pull-request runs are cancelled. Pushes are not: a push run ends in
# a deploy, and cancelling one mid-migration is worse than letting it finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TEST_PG_URL: postgres://inova:inova@localhost:5432

# pnpm version comes from package.json "packageManager" only. Do not also
# pass version to pnpm/action-setup — it fails with Multiple versions specified.

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:stubs
      - run: pnpm check:brands
      - run: pnpm check:routes
      - run: pnpm check:agent-harness
      - run: pnpm check:worklog
      # Every PR names its Linear issue on the first line (AGENTS.md → Tracking
      # in Linear). "Closes" is the word Linear reads to link the PR to the
      # issue and move it on open and merge; the PR template starts with it.
      - name: PR names its Linear issue
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          first_line="$(printf '%s\n' "$PR_BODY" | head -n 1 | tr -d '\r')"
          if ! printf '%s' "$first_line" | grep -Eq '^Closes WHI-[0-9]+$'; then
            echo "The PR body must start with 'Closes WHI-nn' (got: '$first_line')."
            exit 1
          fi

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:no-design-data

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inova
          POSTGRES_PASSWORD: inova
          POSTGRES_DB: inova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inova"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:migrations

  auth:
    name: auth
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inova
          POSTGRES_PASSWORD: inova
          POSTGRES_DB: inova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inova"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @inova/shared build
      - name: Auth flows
        run: pnpm --filter @inova/auth-service test
      - name: Staff / roles RBAC
        run: pnpm --filter @inova/api exec vitest run test/staff-roles.e2e.test.ts

  tenant-isolation:
    name: tenant-isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inova
          POSTGRES_PASSWORD: inova
          POSTGRES_DB: inova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inova"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @inova/shared build
      - name: Isolation + schema contract
        run: pnpm --filter @inova/api test:isolation

  # The admin's main flows in a real browser against the real services on a
  # fresh, seeded database (docs/plan/testing-release.md → End-to-end (web)).
  # Screenshots of the key screens are kept with every run.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inova
          POSTGRES_PASSWORD: inova
          POSTGRES_DB: inova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inova"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm --filter @inova/admin exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Keep the screenshots and the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.run_number }}
          path: |
            apps/admin/e2e-screens/
            apps/admin/playwright-report/
            apps/admin/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Deploys develop to test only. main does not deploy until a production
  # environment exists; to enable it, extend the condition to main and pass
  # `production` for it (that GitHub environment already has an approval gate).
  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref_name == 'develop'
    needs: [static, unit, build, migrations, auth, tenant-isolation, e2e]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: test
    secrets: inherit
    permissions:
      contents: read
      packages: write
