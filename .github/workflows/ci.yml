name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sosedo
          POSTGRES_PASSWORD: sosedo
          POSTGRES_DB: sosedo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sosedo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages and services
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # Tenant-isolation and auth-flow suites are release blockers (AGENTS.md).
      - name: Tests
        run: pnpm test
        env:
          TEST_PG_URL: postgres://sosedo:sosedo@localhost:5432
