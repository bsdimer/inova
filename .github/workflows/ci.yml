name: CI

# GitFlow: develop is the integration branch (deploys to test), main holds
# releases. Pushes to either run every gate; only develop deploys for now —
# there is no production environment yet. Pull requests only run the gates.
on:
  push:
    branches: [main, develop]
  pull_request:

# Superseded pull-request runs are cancelled. Pushes are not: a push run ends in
# a deploy, and cancelling one mid-migration is worse than letting it finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TEST_PG_URL: postgres://inova:inova@localhost:5432

# pnpm version comes from package.json "packageManager" only. Do not also
# pass version to pnpm/action-setup — it fails with Multiple versions specified.

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:stubs
      - run: pnpm check:brands
      - run: pnpm check:routes
      - run: pnpm check:agent-harness
      - run: pnpm check:worklog

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inova
          POSTGRES_PASSWORD: inova
          POSTGRES_DB: inova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inova"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:migrations

  auth:
    name: auth
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inova
          POSTGRES_PASSWORD: inova
          POSTGRES_DB: inova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inova"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @inova/shared build
      - name: Auth flows
        run: pnpm --filter @inova/auth-service test
      - name: Staff / roles RBAC
        run: pnpm --filter @inova/api exec vitest run test/staff-roles.e2e.test.ts

  tenant-isolation:
    name: tenant-isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inova
          POSTGRES_PASSWORD: inova
          POSTGRES_DB: inova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inova"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @inova/shared build
      - name: Isolation + schema contract
        run: pnpm --filter @inova/api test:isolation

  # Deploys develop to test only. main does not deploy until a production
  # environment exists; to enable it, extend the condition to main and pass
  # `production` for it (that GitHub environment already has an approval gate).
  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref_name == 'develop'
    needs: [static, unit, build, migrations, auth, tenant-isolation]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: test
    secrets: inherit
    permissions:
      contents: read
      packages: write
