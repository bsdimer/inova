name: Deploy

# GitFlow environments on the shared host:
#
#   develop -> test   https://test-portal.whitenova.tech   (/opt/inova-test)
#   main    -> none yet; there is no production environment
#
# Called by ci.yml after every gate passes on a push to develop, so the
# workflow file that deploys is always the one on the branch being deployed.
# Per-environment settings (DOMAIN, STACK_DIR, ENV_NAME, PG_SHARED_BUFFERS) are
# GitHub environment variables; `test` accepts deployments from develop only.
# A `production` environment (main only, approval required) is configured in
# GitHub but nothing targets it until production exists.
# workflow_dispatch is the manual path: redeploy, seed test, or roll back by
# re-running an older successful run.
on:
  workflow_call:
    inputs:
      environment:
        description: 'test | production'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (test deploys from develop only)'
        type: choice
        # production is deliberately absent until that environment exists.
        options: [test]
        default: test
      seed:
        description: 'Run db/seed.mjs after migrating — test only, refused anywhere else'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    name: build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: inova-api
            dockerfile: infra/deploy/Dockerfile.service
            build-args: |
              APP=api
              PORT=4000
          - image: inova-auth-service
            dockerfile: infra/deploy/Dockerfile.service
            build-args: |
              APP=auth-service
              PORT=4001
          - image: inova-admin
            dockerfile: infra/deploy/Dockerfile.admin
            build-args: |
              VITE_API_URL=/api/v1
              VITE_AUTH_URL=/auth/v1
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # The target host is amd64; building a second architecture would
          # double the build time for nothing.
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.build-args }}
          # Tagged by commit (what deploys use) and by branch (what is
          # currently on develop / main, for humans).
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    name: deploy ${{ inputs.environment }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.target.outputs.url }}
    # Never cancel a deploy mid-flight (it may be mid-migration); queue instead.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Resolve target
        id: target
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          STACK_DIR: ${{ vars.STACK_DIR }}
          ENV_NAME: ${{ vars.ENV_NAME }}
          PG_SHARED_BUFFERS: ${{ vars.PG_SHARED_BUFFERS }}
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          # An environment missing its variables would otherwise deploy into
          # an empty path; fail before touching the host.
          for v in DOMAIN STACK_DIR ENV_NAME; do
            [ -n "${!v}" ] || { echo "::error::environment variable $v is not set on '${{ inputs.environment }}'"; exit 1; }
          done
          {
            echo "DOMAIN=$DOMAIN"
            echo "STACK_DIR=$STACK_DIR"
            echo "ENV_NAME=$ENV_NAME"
            echo "PG_SHARED_BUFFERS=${PG_SHARED_BUFFERS:-512MB}"
            echo "TARGET=$TARGET"
          } >> "$GITHUB_ENV"
          echo "url=https://$DOMAIN" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # While test is the only environment, its deploys maintain the edge
      # proxy. Once production exists, restrict this step to production
      # deploys: the proxy will then carry production traffic, and a test
      # deploy must not be able to change it.
      - name: Sync and apply the edge proxy
        run: |
          # nginx bind-mounts /opt/edge/conf.d: removing the directory would
          # leave the container on the old inode, seeing it empty. Clear its
          # contents and keep the directory.
          ssh -i ~/.ssh/deploy_key "$TARGET" '
            mkdir -p /opt/edge/conf.d
            find /opt/edge/conf.d -mindepth 1 -delete
            rm -rf /opt/edge/scripts /opt/edge/systemd
          '
          tar -czf - -C infra/deploy/edge docker-compose.yml conf.d domains -C .. scripts systemd \
            | ssh -i ~/.ssh/deploy_key "$TARGET" 'tar -xzf - -C /opt/edge'
          ssh -i ~/.ssh/deploy_key "$TARGET" 'bash /opt/edge/scripts/provision.sh'
          ssh -i ~/.ssh/deploy_key "$TARGET" 'bash /opt/edge/scripts/deploy-edge.sh'

      - name: Sync the app stack
        run: |
          # .env and secrets/ live beside these files and are never touched.
          ssh -i ~/.ssh/deploy_key "$TARGET" "mkdir -p '$STACK_DIR' && rm -rf '$STACK_DIR/scripts'"
          tar -czf - -C infra/deploy docker-compose.yml scripts \
            | ssh -i ~/.ssh/deploy_key "$TARGET" "tar -xzf - -C '$STACK_DIR'"

      - name: Provision the environment (idempotent)
        run: |
          ssh -i ~/.ssh/deploy_key "$TARGET" \
            "STACK_DIR='$STACK_DIR' ENV_NAME='$ENV_NAME' DOMAIN='$DOMAIN' PG_SHARED_BUFFERS='$PG_SHARED_BUFFERS' bash '$STACK_DIR/scripts/provision-env.sh'"

      - name: Registry login on the host
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # This token expires when the job ends, so no long-lived registry
          # credential is left on the host.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key "$TARGET" \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin"

      - name: Deploy
        env:
          # Undefined for workflow_call, which therefore never seeds.
          SEED: ${{ inputs.seed == true }}
        run: |
          ssh -i ~/.ssh/deploy_key "$TARGET" \
            "SEED=$SEED bash '$STACK_DIR/scripts/deploy.sh' ${{ github.sha }}"

      - name: Registry logout on the host
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key "$TARGET" 'docker logout ghcr.io' || true

      - name: Summary
        run: |
          {
            echo "### Deployed \`${{ github.ref_name }}\` to ${{ inputs.environment }}"
            echo
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| url | https://$DOMAIN |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| images | \`$IMAGE_NAMESPACE/inova-{api,auth-service,admin}:${{ github.sha }}\` |"
            echo
            echo "Roll back by re-running an older successful deploy of this environment."
          } >> "$GITHUB_STEP_SUMMARY"
