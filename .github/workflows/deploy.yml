name: Deploy test env

# Runs only after CI is green on main, so the gates in ci.yml (lint, typecheck,
# unit, migrations, auth, tenant-isolation) are the deployment gate too.
# workflow_dispatch is the manual path: re-deploy, seed, or roll back by
# re-running an older successful run.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      seed:
        description: 'Run db/seed.mjs after migrating (demo tenants and users)'
        type: boolean
        default: false

concurrency:
  group: deploy-test-env
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
  # workflow_run reports the commit CI actually tested; workflow_dispatch uses
  # the ref it was started from.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    name: build ${{ matrix.image }}
    # A failed or cancelled CI run must not reach the server.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: inova-api
            dockerfile: infra/deploy/Dockerfile.service
            build-args: |
              APP=api
              PORT=4000
          - image: inova-auth-service
            dockerfile: infra/deploy/Dockerfile.service
            build-args: |
              APP=auth-service
              PORT=4001
          - image: inova-admin
            dockerfile: infra/deploy/Dockerfile.admin
            build-args: |
              VITE_API_URL=/api/v1
              VITE_AUTH_URL=/auth/v1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # The target host is amd64; building a second architecture would
          # double the build time for nothing.
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.build-args }}
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ env.SHA }}
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: test
      url: https://portal.whitenova.tech
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync deployment files
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          # A file deleted from the repo must also disappear from the host,
          # but nginx bind-mounts /opt/inova/nginx/conf.d: removing that
          # directory would leave the running container attached to the old
          # inode, seeing it empty. Clear its contents and keep the directory.
          # .env and secrets/ live outside these paths and are never touched.
          ssh -i ~/.ssh/deploy_key "$TARGET" '
            mkdir -p /opt/inova/nginx/conf.d
            find /opt/inova/nginx/conf.d -mindepth 1 -delete
            rm -rf /opt/inova/scripts /opt/inova/systemd
          '
          tar -czf - -C infra/deploy . \
            | ssh -i ~/.ssh/deploy_key "$TARGET" 'tar -xzf - -C /opt/inova'

      - name: Provision host (idempotent)
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "$TARGET" \
            'bash /opt/inova/scripts/provision.sh'

      - name: Registry login on the host
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # This token expires when the job ends, so no long-lived registry
          # credential is left sitting on the test box.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key "$TARGET" \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin"

      - name: Deploy
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          SEED: ${{ inputs.seed == true }}
        run: |
          ssh -i ~/.ssh/deploy_key "$TARGET" \
            "SEED=$SEED bash /opt/inova/scripts/deploy.sh $SHA"

      - name: Registry logout on the host
        if: always()
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "$TARGET" 'docker logout ghcr.io' || true

      - name: Summary
        run: |
          {
            echo "### Deployed to https://portal.whitenova.tech"
            echo
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| commit | \`$SHA\` |"
            echo "| images | \`$IMAGE_NAMESPACE/inova-{api,auth-service,admin}:$SHA\` |"
            echo
            echo "Roll back by re-running an older successful deploy run."
          } >> "$GITHUB_STEP_SUMMARY"
