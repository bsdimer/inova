name: sosedo

services:
  postgres:
    image: postgres:16-alpine
    container_name: sosedo-postgres
    environment:
      POSTGRES_USER: sosedo
      POSTGRES_PASSWORD: sosedo
      POSTGRES_DB: sosedo
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sosedo']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sosedo-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: sosedo-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: sosedo
      MINIO_ROOT_PASSWORD: sosedo-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: sosedo-mailhog
    ports:
      - '1025:1025' # smtp
      - '8025:8025' # web ui

volumes:
  postgres-data:
  minio-data:
