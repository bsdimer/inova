# Static SPA container. TLS, HSTS and rate limits live on the front proxy.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite emits content-hashed asset filenames, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves clients on old assets.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routing: unknown paths are TanStack Router routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
