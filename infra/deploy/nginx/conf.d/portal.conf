# Front proxy for the test environment.
#
#   portal.whitenova.tech/           -> admin SPA container
#   portal.whitenova.tech/api/v1/*   -> core-api      (prefix stripped)
#   portal.whitenova.tech/auth/v1/*  -> auth-service  (prefix stripped)
#
# Path-based routing keeps this to one certificate, one DNS record and no CORS.

# Docker's embedded DNS, re-resolved so a restarted container with a new IP
# does not leave nginx proxying to a dead address until the next reload.
resolver 127.0.0.11 valid=10s ipv6=off;

# Login and invite-code endpoints are the brute-force surface. auth-service
# throttles per route as well; this is the cheap outer bound.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/s;

# Anything that is not an exact host match (bare IP, whitenova.tech apex, which
# also resolves here) gets nothing. Prevents this test box answering for hosts
# it does not own.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name portal.whitenova.tech;

    # HTTP-01 renewal. Must stay reachable over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name portal.whitenova.tech;

    ssl_certificate /etc/letsencrypt/live/portal.whitenova.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.whitenova.tech/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/portal.whitenova.tech/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # No ssl_stapling: Let's Encrypt certificates no longer carry an OCSP
    # responder URL, so nginx ignores it and warns on every reload.

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Headroom for the issue-photo uploads that land in M3.
    client_max_body_size 10m;

    access_log /var/log/nginx/portal.access.log;
    error_log /var/log/nginx/portal.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location /api/ {
        set $core_api "http://api:4000";
        rewrite ^/api/?(.*)$ /$1 break;
        include /etc/nginx/conf.d/proxy-common.inc;
        proxy_pass $core_api;
    }

    location /auth/ {
        set $auth_service "http://auth-service:4001";
        limit_req zone=auth_zone burst=20 nodelay;
        rewrite ^/auth/?(.*)$ /$1 break;
        include /etc/nginx/conf.d/proxy-common.inc;
        proxy_pass $auth_service;
    }

    location / {
        set $admin "http://admin:80";
        include /etc/nginx/conf.d/proxy-common.inc;
        proxy_pass $admin;
    }
}

# Container liveness only, never published to the host. The public server
# blocks all either redirect or require TLS, which makes them useless as a
# health probe from inside the container.
server {
    listen 8080;
    server_name _;
    access_log off;

    location = /healthz {
        return 200 "ok\n";
        default_type text/plain;
    }

    location / {
        return 444;
    }
}
