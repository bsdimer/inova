# One environment's app stack. The same file is deployed to /opt/inova
# (production, ENV_NAME=prod) and /opt/inova-test (test, ENV_NAME=test); each
# directory has its own .env, secrets and volumes, so the environments share
# nothing but the host and the edge proxy in edge/docker-compose.yml.
#
# Images are built and pushed by .github/workflows/deploy.yml; this host only
# pulls them. Postgres and Redis publish no ports and stay off the `edge`
# network — they are reachable only from inside their own stack.
#
# Values come from <stack>/.env, written by scripts/provision-env.sh.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: inova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: inova
    # Two environments share a 3.7 GB box: keep Postgres modest (test sets a
    # smaller PG_SHARED_BUFFERS) and let the kernel page cache do the rest.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=1536MB
      - -c
      - max_connections=60
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U inova -d inova']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '128mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 192m
    logging: *logging

  auth-service:
    image: ${IMAGE_REGISTRY:?set in .env}/inova-auth-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      default: {}
      edge:
        aliases: ['${ENV_NAME:?set in .env}-auth']
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://inova_app:${APP_DB_PASSWORD:?set in .env}@postgres:5432/inova
      REDIS_URL: redis://redis:6379
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-private.pem
      AUTH_THROTTLE_STRICT: 'true'
    volumes:
      # Relative to the stack directory, never absolute: this file is shared by
      # every environment, and an absolute path would make them all sign with
      # the same key — tokens from test would then be accepted by production.
      - ./secrets/jwt-private.pem:/run/secrets/jwt-private.pem:ro
    deploy:
      resources:
        limits:
          memory: 512m
    logging: *logging

  api:
    image: ${IMAGE_REGISTRY:?set in .env}/inova-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      default: {}
      edge:
        aliases: ['${ENV_NAME:?set in .env}-api']
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://inova_app:${APP_DB_PASSWORD:?set in .env}@postgres:5432/inova
      REDIS_URL: redis://redis:6379
      # JWKS is fetched over the internal network — no public round trip, and
      # core-api still verifies tokens locally after the first fetch.
      #
      # Must be the environment-prefixed alias, not `auth-service`: Compose
      # registers the plain service name on every network a container joins,
      # so on the shared `edge` network `auth-service` resolves to BOTH
      # environments' containers. Production could then trust test's signing
      # key.
      AUTH_JWKS_URL: http://${ENV_NAME:?set in .env}-auth:4001/.well-known/jwks.json
    deploy:
      resources:
        limits:
          memory: 512m
    logging: *logging

  admin:
    image: ${IMAGE_REGISTRY:?set in .env}/inova-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      default: {}
      edge:
        aliases: ['${ENV_NAME:?set in .env}-admin']
    deploy:
      resources:
        limits:
          memory: 64m
    logging: *logging

  # One-shot tooling, never started by `docker compose up`:
  #   docker compose run --rm migrator
  #   docker compose run --rm seed
  # The auth-service image is the one that carries both pg and bcryptjs.
  migrator:
    image: ${IMAGE_REGISTRY:?set in .env}/inova-auth-service:${IMAGE_TAG:-latest}
    profiles: ['tools']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL_MIGRATOR: postgres://inova:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/inova
    command: ['node', 'db/migrate.mjs']
    logging: *logging

  seed:
    image: ${IMAGE_REGISTRY:?set in .env}/inova-auth-service:${IMAGE_TAG:-latest}
    profiles: ['tools']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL_MIGRATOR: postgres://inova:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/inova
    command: ['node', 'db/seed.mjs']
    logging: *logging

networks:
  default: {}
  edge:
    external: true

volumes:
  postgres-data:
  redis-data:
