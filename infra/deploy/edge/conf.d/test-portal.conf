# Test environment — test-portal.whitenova.tech -> the `test` app stack.

server {
    listen 80;
    server_name test-portal.whitenova.tech;

    # HTTP-01 renewal. Must stay reachable over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name test-portal.whitenova.tech;

    ssl_certificate /etc/letsencrypt/live/test-portal.whitenova.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test-portal.whitenova.tech/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/test-portal.whitenova.tech/chain.pem;

    set $app_env test;
    include /etc/nginx/conf.d/site-common.inc;

    # The test stack's mailbox (WHI-150). Mailpit asks for its own password;
    # its live view is a websocket, hence the upgrade headers.
    location /mail/ {
        set $mailbox "http://test-mail:8025";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 1h;
        proxy_pass $mailbox;
    }
}
