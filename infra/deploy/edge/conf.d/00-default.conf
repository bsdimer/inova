# Edge proxy: http-level settings and the catch-all servers. Loaded first
# (00-) so the zone below exists before any site references it.

# Docker's embedded DNS, re-resolved so a restarted app container with a new IP
# does not leave nginx proxying to a dead address until the next reload.
resolver 127.0.0.11 valid=10s ipv6=off;

# Login and invite-code endpoints are the brute-force surface. auth-service
# throttles per route as well; this is the cheap outer bound, shared by all
# environments on this host.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/s;

# Any Host without its own site file (bare IP, the whitenova.tech apex, a
# hostname whose certificate has not been issued yet) gets nothing — except
# ACME challenges, so a new hostname can obtain its first certificate over the
# webroot before its site file is deployed.
server {
    listen 80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 444;
    }
}

# Container liveness only, never published to the host. The public servers
# all redirect or require TLS, which makes them useless as a probe.
server {
    listen 8080;
    server_name _;
    access_log off;

    location = /healthz {
        return 200 "ok\n";
        default_type text/plain;
    }

    location / {
        return 444;
    }
}
